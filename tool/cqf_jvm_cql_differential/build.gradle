plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.cqframework:engine:5.3.0'
    implementation 'org.cqframework:engine-fhir:5.3.0'
    implementation 'org.cqframework:quick:5.3.0'
    runtimeOnly 'org.slf4j:slf4j-nop:2.0.13'
}

dependencyLocking {
    lockAllConfigurations()
}

layout.buildDirectory = file("${rootDir}/../../build/cqf_jvm_cql_differential")

application {
    mainClass = 'org.parkinsum.cqfjvm.CqfJvmDifferential'
}

tasks.withType(JavaCompile).configureEach {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    options.release = 17
}

tasks.named('run', JavaExec).configure {
    standardInput = System.in
}

tasks.register('fhirRun', JavaExec) {
    group = 'application'
    description = 'Runs the fixed synthetic FHIR R4 retrieval comparison.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.parkinsum.cqfjvm.CqfJvmFhirDifferential'
    standardInput = System.in
}

tasks.register('fhirObservationTerminologyRun', JavaExec) {
    group = 'application'
    description = 'Runs the six fixed synthetic FHIR R4 Observation terminology cases.'
    classpath = sourceSets.main.runtimeClasspath
