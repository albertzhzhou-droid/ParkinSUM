name: CI

on:
  push:
    branches:
      - main
  # Every pull request, not just those targeting main: restricting this to
  # `branches: [main]` meant stacked PRs (base = another feature branch) ran
  # no tests, analysis, or governance gates at all. Matches the trigger the
  # public-release-preflight workflow already uses.
  pull_request:

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned deliberately. An unpinned `channel: stable` silently tracks
          # whatever Flutter is current, which produced three surprise CI
          # failures with no code change on our side: a new `unawaited_return_
          # in_try_block` warning, a repo-wide `dart format` style change, and
          # two new lint rules. Pinning makes a toolchain move an explicit,
          # reviewable commit. Dependabot does not bump this; raise it
          # intentionally alongside a green run.
          flutter-version: '3.47.0'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      # CI should report formatting drift without rewriting files in the runner.
      # Scoped to source dirs: `dart format .` ignores analysis_options'
      # analyzer excludes, so a stray build/ directory (platform SourcePackages,
      # generated example code) would be formatted and fail the check.
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Verify initialized-user algorithm journey
        run: flutter test test/registered_user_algorithm_journey_test.dart

      - name: Build local-mode Web release
        run: flutter build web --release --dart-define=PARKINSUM_BACKEND=local

      - name: Build local-mode Android debug APK
        run: flutter build apk --debug --dart-define=PARKINSUM_BACKEND=local

      # The source contract is checked in verify:all, but only this job owns a
      # real merged Android manifest. Comparing artifact permissions and the
      # deny-backup attributes here prevents merge-time drift from bypassing
      # the review.
      - name: Validate built Android privacy facts
        run: >-
          node tool/store_privacy_contract_check.mjs
          --android-manifest
          build/app/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml

  node-preflight:
    name: Node public preflight
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java for Firestore Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Node dependencies
        run: npm ci

      - name: Run public repository preflight
        run: npm run public:preflight

      - name: Validate Firestore rules contract
        run: npm run rules:contract

      - name: Validate Firestore emulator runtime selection
        run: npm run rules:runner:test

      - name: Validate versioned schema catalog
        run: npm run schema:contract

      - name: Validate complete-app research and delivery queue
        run: npm run upgrade:queue

      - name: Validate store privacy declaration contract
        run: npm run privacy:store

      - name: Validate open-source influence and license firewall
        run: npm run open-source:firewall

      - name: Validate release fail-closed contracts
        run: npm run release:contract

      - name: Audit production Node dependencies
        run: npm run security:dependencies

      - name: Validate Firestore rules behavior in Emulator
        run: npm run rules:test

  governance-gates:
    name: Governance gates
    runs-on: ubuntu-latest
    # These gates are deterministic, offline, and synthetic-data only. Each one
    # exits non-zero on a blocker, so they act as a real ratchet rather than a
    # report. They need BOTH toolchains: the npm scripts are thin wrappers that
    # spawn `dart run`.
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned deliberately. An unpinned `channel: stable` silently tracks
          # whatever Flutter is current, which produced three surprise CI
          # failures with no code change on our side: a new `unawaited_return_
          # in_try_block` warning, a repo-wide `dart format` style change, and
          # two new lint rules. Pinning makes a toolchain move an explicit,
          # reviewable commit. Dependabot does not bump this; raise it
          # intentionally alongside a green run.
          flutter-version: '3.47.0'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          flutter pub get
          npm ci

      # One command runs every gate — copy compile, localization lint, the two
      # deterministic replays, the scenario fuzzer, privacy preflight, the
      # open-source influence firewall, source access + drift, the contribution
      # router, and the committed-golden drift check. It exits non-zero if any
      # single gate does, and composes the
      # results into build/verify_all/latest.{json,md}.
      #
      # This is the same command a reviewer runs locally, so CI and local
      # verification cannot drift apart. `npm run verify:all -- --list` prints
      # the gate inventory.
      - name: All governance gates + committed-golden drift check
        run: npm run verify:all

      # Uploaded so a failing run is diagnosable without re-running the gates
      # locally. The report is timestamp-free and diffs cleanly.
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-all-report
          path: build/verify_all/
          if-no-files-found: warn
