name: Publish release-metadata package

# Publishes the scoped release-metadata package
# (@albertzhzhou-droid/parkinsum-companion) to GitHub Packages (npm registry).
#
# This package ships release metadata only — it is not the app runtime and
# contains no medical logic or patient data. Educational prototype; synthetic
# data only; not a medical device; no medical advice.

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches:
      - 'publish-package-**'
    paths:
      - 'packages/npm/**'
      - '.github/workflows/publish-npm-package.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: packages/npm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@albertzhzhou-droid'

      - name: Smoke-check the package manifest
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const pkg = require('./package.json');
          const release = require('./index.js');
          assert.equal(release.name, pkg.name);
          assert.equal(release.release, `v${pkg.version}`);
          assert.equal(release.prerelease, false);
          assert.equal(release.safetyBoundary.isMedicalDevice, false);
          assert.equal(release.safetyBoundary.isClinicallyValidated, false);
          assert.equal(release.safetyBoundary.providesMedicalAdvice, false);
          assert.equal(pkg.license, 'Apache-2.0');
          assert.equal(fs.readFileSync('LICENSE', 'utf8'), fs.readFileSync('../../LICENSE', 'utf8'));
          if (process.env.RELEASE_TAG) {
            assert.equal(process.env.RELEASE_TAG, release.release);
          }
          console.log('manifest ok:', release.release);
          NODE

      - name: Publish to GitHub Packages
        run: npm publish --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the latest package version
        run: |
          expected="$(node -p "require('./package.json').version")"
          actual="$(npm view @albertzhzhou-droid/parkinsum-companion dist-tags.latest)"
          test "$actual" = "$expected"
          echo "GitHub Packages latest: $actual"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
