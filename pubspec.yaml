name: parkinsum_companion
description: ParkinSUM Companion (local-first) Flutter app.
publish_to: "none"

version: 0.2.0+2

environment:
  # Floor tracks the strictest dependency rather than history: xml 7.0.1
  # requires Dart ^3.11.0, so anything lower cannot resolve at all. Keeping the
  # stale ">=3.3.0" made `flutter pub get` fail with an error naming xml
  # instead of the SDK. Raising it also raises the package language version,
  # which is why this commit carries the accompanying `dart format` pass.
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.9

  # 状态管理（代码里用到 Provider / ChangeNotifierProxyProvider）
  provider: ^6.1.2

  # 本地持久化（DataService 的 SharedPreferences 实现）
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1
  sqflite: ^2.4.3
  path: ^1.9.0
  yaml: ^3.1.2
  http: ^1.2.1
  xml: ^7.0.1
  archive: ^4.0.9
  csv: ^6.0.0
  crypto: ^3.0.6
  csv: ^8.0.0
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.8.0
  firebase_app_check: ^0.4.4+1
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  pdf: ^3.13.0
  printing: ^5.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/data/
    - config/complete_app_upgrade_queue.json
