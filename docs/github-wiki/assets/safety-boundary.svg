<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="t d">
<title id="t">Safety boundary</title>
<desc id="d">A boundary ring around the words educational prototype, synthetic data only. Inside: architecture review, deterministic rule explanations, synthetic walkthroughs, provenance inspection. Outside: diagnosis or treatment, medication timing or dose, dietary instructions, real patient data.</desc>
<style>
:root {
  color-scheme: light dark;
  --paper: #F6F1E6; --sheet: #FFFDF8; --sunken: #EEE6D6;
  --ink: #2A2420; --ink2: #453D35; --muted: #6E655A; --faint: #A39888;
  --line: #CBBFA8; --hair: #E2D9C8;
  --accent: #A84B2A; --accent-soft: #F3E2D6; --gilt: #A8874A; --ok: #4E7A4A;
  --top: #F2EBDD; --left: #DED3BF; --right: #CDBFA6; --dot: #2A2420;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #1C1916; --sheet: #26211D; --sunken: #2E2823;
    --ink: #F1E9DC; --ink2: #D9CFC0; --muted: #B3A795; --faint: #7F7568;
    --line: #5A4F44; --hair: #3A332C;
    --accent: #E38D66; --accent-soft: #4A2E22; --gilt: #CDAE72; --ok: #8DBA86;
    --top: #4A4138; --left: #3A322B; --right: #2E2822; --dot: #F1E9DC;
  }
}

.bg { fill: var(--paper); }
.ink { fill: var(--ink); } .ink2 { fill: var(--ink2); }
.muted { fill: var(--muted); } .faint { fill: var(--faint); }
.accent { fill: var(--accent); }
text { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.cap { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
.h1 { font-size: 30px; font-weight: 650; letter-spacing: .02em; }
.h2 { font-size: 19px; font-weight: 600; }
.body { font-size: 13px; }
.small { font-size: 11.5px; }
.stroke-ink { stroke: var(--ink); fill: none; }
.stroke-line { stroke: var(--line); fill: none; }
.stroke-accent { stroke: var(--accent); fill: none; }

.inner { fill: var(--sheet); stroke: var(--ink); stroke-width: 1.3; }
.outer { fill: none; stroke: var(--accent); stroke-width: 1.4; stroke-dasharray: 3 7;
  transform-origin: 250px 180px; animation: spin 40s linear infinite; }
.sweep { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round;
  transform-origin: 250px 180px; animation: spin 7s cubic-bezier(0.65, 0, 0.35, 1) infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.pulse { fill: none; stroke: var(--line); transform-origin: 250px 180px;
  animation: pulse 4s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
@keyframes pulse { from { transform: scale(.7); opacity: .9; } to { transform: scale(1.25); opacity: 0; } }
.item { opacity: 0; animation: item 12s linear infinite; }
@keyframes item { 0% { opacity: 0; transform: translateX(-6px); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); } 3%, 92% { opacity: 1; transform: none; } 97%, 100% { opacity: 0; } }
.x { stroke: var(--accent); stroke-width: 1.8; stroke-linecap: round; }
.okm { stroke: var(--ok); stroke-width: 1.8; fill: none; stroke-linecap: round; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .item { opacity: 1; }
}
</style>
<rect class="bg" width="960" height="360" rx="14"/>
<circle class="pulse" cx="250" cy="180" r="110"/>
<circle class="outer" cx="250" cy="180" r="138"/>
<path class="sweep" d="M 250 42 A 138 138 0 0 1 369.5 111"/>
<circle class="inner" cx="250" cy="180" r="96"/>
<text x="250.0" y="162.0" class="cap ink" text-anchor="middle">Educational</text>
<text x="250.0" y="182.0" class="cap ink" text-anchor="middle">prototype</text>
<text x="250.0" y="206.0" class="small muted" text-anchor="middle">synthetic data only</text>
<text x="470.0" y="64.0" class="cap ink" text-anchor="start">Inside the boundary</text>
<text x="760.0" y="64.0" class="cap accent" text-anchor="start">Outside the boundary</text>
<g class="item" style="animation-delay:0.00s"><path class="okm" d="M 470 94 l 4 4 l 8 -9"/><text x="490.0" y="98.0" class="body ink" text-anchor="start">Architecture and code review</text></g>
<g class="item" style="animation-delay:0.15s"><path class="okm" d="M 470 128 l 4 4 l 8 -9"/><text x="490.0" y="132.0" class="body ink" text-anchor="start">Deterministic rule explanations</text></g>
<g class="item" style="animation-delay:0.30s"><path class="okm" d="M 470 162 l 4 4 l 8 -9"/><text x="490.0" y="166.0" class="body ink" text-anchor="start">Synthetic-data walkthroughs</text></g>
<g class="item" style="animation-delay:0.45s"><path class="okm" d="M 470 196 l 4 4 l 8 -9"/><text x="490.0" y="200.0" class="body ink" text-anchor="start">Provenance and evidence inspection</text></g>
<g class="item" style="animation-delay:0.60s"><line class="x" x1="760" y1="89" x2="769" y2="98"/><line class="x" x1="769" y1="89" x2="760" y2="98"/><text x="780.0" y="98.0" class="body ink" text-anchor="start">Diagnosis or treatment</text></g>
<g class="item" style="animation-delay:0.75s"><line class="x" x1="760" y1="123" x2="769" y2="132"/><line class="x" x1="769" y1="123" x2="760" y2="132"/><text x="780.0" y="132.0" class="body ink" text-anchor="start">Medication timing or dose</text></g>
<g class="item" style="animation-delay:0.90s"><line class="x" x1="760" y1="157" x2="769" y2="166"/><line class="x" x1="769" y1="157" x2="760" y2="166"/><text x="780.0" y="166.0" class="body ink" text-anchor="start">Dietary instructions</text></g>
<g class="item" style="animation-delay:1.05s"><line class="x" x1="760" y1="191" x2="769" y2="200"/><line class="x" x1="769" y1="191" x2="760" y2="200"/><text x="780.0" y="200.0" class="body ink" text-anchor="start">Real patient data or PHI</text></g>
<line class="stroke-line" x1="470" y1="250" x2="920" y2="250"/>
<text x="470.0" y="276.0" class="body ink2" text-anchor="start">Not a medical device and not clinically validated.</text>
<text x="470.0" y="298.0" class="body ink2" text-anchor="start">Review any health question with a qualified clinician.</text>
</svg>
