<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="t d">
<title id="t">LNAA load calibration</title>
<desc id="d">Bar chart of the median competing-LNAA fraction of protein per protein source from official FoodData Central rows: dairy 0.338, egg 0.315, meat 0.264, fish 0.264, grain 0.263, soy 0.257, legume 0.248, with interquartile whiskers. The reference line slides from the old value 0.45 to the all-food median 0.2667.</desc>
<style>
:root {
  color-scheme: light dark;
  --paper: #F6F1E6; --sheet: #FFFDF8; --sunken: #EEE6D6;
  --ink: #2A2420; --ink2: #453D35; --muted: #6E655A; --faint: #A39888;
  --line: #CBBFA8; --hair: #E2D9C8;
  --accent: #A84B2A; --accent-soft: #F3E2D6; --gilt: #A8874A; --ok: #4E7A4A;
  --top: #F2EBDD; --left: #DED3BF; --right: #CDBFA6; --dot: #2A2420;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #1C1916; --sheet: #26211D; --sunken: #2E2823;
    --ink: #F1E9DC; --ink2: #D9CFC0; --muted: #B3A795; --faint: #7F7568;
    --line: #5A4F44; --hair: #3A332C;
    --accent: #E38D66; --accent-soft: #4A2E22; --gilt: #CDAE72; --ok: #8DBA86;
    --top: #4A4138; --left: #3A322B; --right: #2E2822; --dot: #F1E9DC;
  }
}

.bg { fill: var(--paper); }
.ink { fill: var(--ink); } .ink2 { fill: var(--ink2); }
.muted { fill: var(--muted); } .faint { fill: var(--faint); }
.accent { fill: var(--accent); }
text { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.cap { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
.h1 { font-size: 30px; font-weight: 650; letter-spacing: .02em; }
.h2 { font-size: 19px; font-weight: 600; }
.body { font-size: 13px; }
.small { font-size: 11.5px; }
.stroke-ink { stroke: var(--ink); fill: none; }
.stroke-line { stroke: var(--line); fill: none; }
.stroke-accent { stroke: var(--accent); fill: none; }

.bar { fill: var(--left); stroke: var(--line); }
.iqr { stroke: var(--ink); stroke-width: 1.4; }
.ref { stroke: var(--accent); stroke-width: 1.6; }
.old { stroke: var(--faint); stroke-width: 1.4; stroke-dasharray: 4 4; }
.grow { transform-box: fill-box; transform-origin: left center; transform: scaleX(0);
  animation: grow 8s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
@keyframes grow { 0%, 4% { transform: scaleX(0); } 22%, 90% { transform: scaleX(1); animation-timing-function: cubic-bezier(0.4, 0, 1, 1); } 98%, 100% { transform: scaleX(0); } }
.fade { opacity: 0; animation: fade 8s linear infinite; }
@keyframes fade { 0%, 20% { opacity: 0; } 28%, 90% { opacity: 1; } 97%, 100% { opacity: 0; } }
.slide { animation: slide 8s linear infinite; }
@keyframes slide { 0%, 6% { transform: translateX(436.1px); animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1); }
  20%, 92% { transform: translateX(0); } 100% { transform: translateX(436.1px); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .grow { transform: none; } .fade { opacity: 1; } .slide { transform: none; }
}
</style>
