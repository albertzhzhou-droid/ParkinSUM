<g class="slide"><line class="ref" x1="376.3" y1="90" x2="376.3" y2="350"/><text x="376.3" y="84.0" class="small mono accent" text-anchor="middle">all-food median 0.2667</text></g>
<text x="40.0" y="408.0" class="small muted" text-anchor="start">Bars: type median; whiskers: interquartile range over amino-acid patterns; n = records / patterns; ×: factor over the all-food median.</text>
<text x="40.0" y="428.0" class="small muted" text-anchor="start">Composition of sampled foods, not people. The mapping from load to competition pressure stays a prototype heuristic.</text>
